models:
  - model:
      name: Generic
      vendor: QSC
      filter: get("type").asText().equals("Core") == false
      properties:
        startedAt: get("startedAt")
        deviceModel: get("model")
        deviceName: get("name")
        deviceId: get("id")
        manufacturer: get("manufacturer")
        location: get("location")
        deviceType: get("type")
        firmwareVersion: get("firmware")
        siteId: get("site")?.get("id")
        siteName: get("site")?.get("name")
        deviceUptime: get("uptime")
        deviceStatusMessage: get("status")?.get("message")
      mapping:
        deviceType: get("type")
        deviceModel: get("model")
        deviceName: get("name")
        deviceId: get("id")
        manufacturer: get("manufacturer")
        location: get("location")
        startedAt: get("startedAt")
        serialNumber: get("serial")
        deviceUptime: get("uptime")
        siteId: get("site")?.get("id")
        siteName: get("site")?.get("name")