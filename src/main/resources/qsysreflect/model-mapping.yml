models:
  - model:
      name: Generic
      vendor: QSC
      filter: '"Core 110f".equals(get("model")?.asText()) == false && "Core 510i".equals(get("model")?.asText()) == false && "NV-32-H (Core Mode)".equals(get("model")?.asText()) == false'
      properties:
        FirmwareVersion: get("firmware")
        SiteID: get("site")?.get("id")
        SiteName: get("site")?.get("name")
        DeviceUptime: get("uptime")
        DeviceStatusMessage: get("status")?.get("message")
      mapping:
        deviceModel: get("model")
        deviceName: get("name")
        deviceId: get("id")
        serialNumber: get("serial")
        deviceUptime: get("uptime")
        siteId: get("site")?.get("id")
        siteName: get("site")?.get("name")
